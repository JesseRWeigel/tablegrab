name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Never `group: pages`. One wedged run holds that shared lock, every later deploy queues
  # behind it, and a wedged run cannot always be cancelled.
  group: pages-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: the published page must match the source
        run: python3 scripts/build_docs.py --check
      - name: the unit suite must pass
        run: node --test "tests/*.test.js"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
